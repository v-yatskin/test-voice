<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBot Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10; --surface: #111318; --border: #1e2229;
    --accent: #00e5ff; --accent2: #7c4dff;
    --text: #e8eaf0; --muted: #4a5060;
    --user-bg: #0d1f2d; --bot-bg: #13101f;
    --danger: #ff3d6b; --success: #00e5a0; --warn: #ffb300;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px;
    background-image:
      radial-gradient(ellipse 60% 40% at 70% 10%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 20% 80%, rgba(124,77,255,0.05) 0%, transparent 60%);
  }
  header { width:100%; max-width:680px; margin-bottom:20px; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:-0.02em; }
  .tag { font-size:0.65rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); border:1px solid rgba(0,229,255,0.3); padding:2px 8px; border-radius:2px; }

  /* STT mode toggle */
  .mode-bar {
    width:100%; max-width:680px; display:flex; align-items:center; gap:8px;
    margin-bottom:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:4px; position:relative;
  }
  .mode-btn {
    flex:1; padding:8px; border:none; background:transparent; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); border-radius:4px; transition:all 0.2s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .mode-btn.active { background:rgba(0,229,255,0.1); color:var(--accent); }
  .mode-btn svg { width:14px; height:14px; }
  .mode-divider { width:1px; height:24px; background:var(--border); flex-shrink:0; }

  /* Whisper download panel */
  .whisper-panel {
    width:100%; max-width:680px; margin-bottom:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    overflow:hidden; display:none;
  }
  .whisper-panel.visible { display:block; }
  .whisper-inner { padding:14px 16px; }
  .whisper-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:10px; }
  .model-info { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .model-name { font-size:0.8rem; color:var(--text); }
  .model-size { font-size:0.68rem; color:var(--muted); }
  .download-btn {
    padding:8px 16px; background:rgba(0,229,255,0.1); border:1px solid rgba(0,229,255,0.3);
    color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; border-radius:4px;
    transition:all 0.2s; white-space:nowrap;
  }
  .download-btn:hover { background:rgba(0,229,255,0.18); }
  .download-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .progress-wrap { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-bar { height:100%; background:var(--accent); width:0%; transition:width 0.2s; border-radius:2px; }
  .progress-label { font-size:0.65rem; color:var(--muted); margin-top:6px; }
  .model-selector { display:flex; gap:6px; margin-bottom:12px; }
  .model-choice {
    flex:1; padding:6px 0; background:transparent; border:1px solid var(--border);
    color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; border-radius:4px;
    transition:all 0.2s;
  }
  .model-choice:hover { border-color:var(--accent); color:var(--accent); }
  .model-choice.active { border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,0.08); }
  .model-choice.loaded { border-color:var(--success); color:var(--success); background:rgba(0,229,165,0.08); }
  .model-choice:disabled { opacity:0.35; cursor:not-allowed; }
  .model-ready { display:none; align-items:center; gap:8px; font-size:0.72rem; color:var(--success); }
  .model-ready.visible { display:flex; }

  /* Backend (WASM / WebGPU) toggle */
  .backend-bar {
    display:flex; gap:4px; margin-bottom:12px; background:var(--bg);
    border:1px solid var(--border); border-radius:4px; padding:3px;
  }
  .backend-btn {
    flex:1; padding:6px 0; background:transparent; border:none; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:0.66rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--muted); border-radius:3px; transition:all 0.2s;
  }
  .backend-btn.active { background:rgba(0,229,255,0.1); color:var(--accent); }
  .backend-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .backend-btn .badge { font-size:0.55rem; opacity:0.7; margin-left:4px; letter-spacing:0.04em; }

  /* Vosk model URL input */
  .vosk-url-input {
    width:100%; margin-bottom:12px; padding:8px 10px;
    background:var(--bg); border:1px solid var(--border); border-radius:4px;
    color:var(--text); font-family:'JetBrains Mono',monospace; font-size:0.7rem;
    outline:none; transition:border-color 0.2s;
  }
  .vosk-url-input:focus { border-color:rgba(0,229,255,0.3); }
  .vosk-url-input::placeholder { color:var(--muted); }
  .vosk-presets { display:flex; gap:6px; margin-bottom:10px; }
  .vosk-preset {
    flex:1; padding:8px 4px; background:rgba(0,229,255,0.08);
    border:1px solid rgba(0,229,255,0.3); border-radius:4px;
    color:var(--accent); font-family:'JetBrains Mono',monospace;
    font-size:0.66rem; text-transform:uppercase; letter-spacing:0.08em;
    cursor:pointer; transition:all 0.2s;
  }
  .vosk-preset:hover { background:rgba(0,229,255,0.18); }
  .vosk-preset:disabled { opacity:0.4; cursor:not-allowed; }
  .vosk-or {
    text-align:center; font-size:0.6rem; color:var(--muted);
    margin:6px 0 10px; letter-spacing:0.1em; text-transform:uppercase;
  }

  /* Status bar */
  .status-bar {
    width:100%; max-width:680px; display:flex; align-items:center;
    gap:8px; margin-bottom:12px; height:28px;
  }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:all 0.3s; flex-shrink:0; }
  .status-dot.listening { background:var(--danger); box-shadow:0 0 8px var(--danger); animation:pulse 1s infinite; }
  .status-dot.speaking  { background:var(--accent);  box-shadow:0 0 8px var(--accent); animation:pulse 1.4s infinite; }
  .status-dot.loading   { background:var(--warn);    box-shadow:0 0 8px var(--warn);   animation:pulse 0.8s infinite; }
  .status-dot.idle      { background:var(--success); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .status-text { font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
  .interim-text { font-size:0.7rem; color:var(--accent); opacity:0.7; font-style:italic;
    margin-left:auto; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Chat */
  .chat-window {
    width:100%; max-width:680px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:20px;
    min-height:320px; max-height:45vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth;
  }
  .chat-window::-webkit-scrollbar { width:4px; }
  .chat-window::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .message { display:flex; flex-direction:column; gap:4px; animation:slideIn 0.2s ease-out; }
  @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .message.user { align-items:flex-end; }
  .message.bot  { align-items:flex-start; }
  .message-label { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .message-bubble {
    max-width:80%; padding:10px 14px; border-radius:6px;
    font-size:0.82rem; line-height:1.6;
  }
  .message.user .message-bubble { background:var(--user-bg); border:1px solid rgba(0,229,255,0.15); border-bottom-right-radius:2px; }
  .message.bot  .message-bubble { background:var(--bot-bg);  border:1px solid rgba(124,77,255,0.2); border-bottom-left-radius:2px; }
  .message-meta { font-size:0.58rem; color:var(--muted); letter-spacing:0.04em;
    font-family:'JetBrains Mono',monospace; opacity:0.7; }
  .message.user .message-meta { text-align:right; }
  .message.bot  .message-meta { text-align:left; }

  /* Controls */
  .controls { width:100%; max-width:680px; margin-top:14px; display:flex; align-items:center; gap:12px; }
  .mic-btn {
    width:56px; height:56px; border-radius:50%; border:2px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:all 0.2s; flex-shrink:0; position:relative; overflow:hidden;
  }
  .mic-btn::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle,rgba(0,229,255,0.15) 0%,transparent 70%);
    opacity:0; transition:opacity 0.2s;
  }
  .mic-btn:hover::before { opacity:1; }
  .mic-btn:hover { border-color:var(--accent); }
  .mic-btn.active { border-color:var(--danger); background:rgba(255,61,107,0.08); animation:ringPulse 1s infinite; }
  .mic-btn:disabled { opacity:0.35; cursor:not-allowed; }
  @keyframes ringPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,61,107,0.4)} 50%{box-shadow:0 0 0 10px rgba(255,61,107,0)} }
  .mic-btn svg { width:22px; height:22px; transition:all 0.2s; }
  .mic-btn.active svg { stroke:var(--danger); }
  .input-wrap {
    flex:1; display:flex; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:6px; overflow:hidden; transition:border-color 0.2s;
  }
  .input-wrap:focus-within { border-color:rgba(0,229,255,0.3); }
  .text-input {
    flex:1; background:transparent; border:none; outline:none;
    padding:14px 16px; font-family:'JetBrains Mono',monospace; font-size:0.82rem;
    color:var(--text); caret-color:var(--accent);
  }
  .text-input::placeholder { color:var(--muted); }
  .send-btn {
    background:transparent; border:none; border-left:1px solid var(--border);
    padding:0 16px; height:100%; cursor:pointer; color:var(--muted);
    display:flex; align-items:center; transition:color 0.2s,background 0.2s;
  }
  .send-btn:hover { color:var(--accent); background:rgba(0,229,255,0.05); }
  .send-btn svg { width:18px; height:18px; }

  /* Footer */
  .footer-row {
    width:100%; max-width:680px; display:flex; align-items:center;
    justify-content:space-between; margin-top:10px; padding:0 2px;
  }
  .browser-note { font-size:0.62rem; color:var(--muted); letter-spacing:0.05em; }
  .voice-toggle { display:flex; align-items:center; gap:6px; font-size:0.65rem;
    color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; user-select:none; }
  .toggle-switch { width:32px; height:18px; background:var(--border); border-radius:9px;
    position:relative; transition:background 0.2s; cursor:pointer; flex-shrink:0; }
  .toggle-switch.on { background:rgba(0,229,255,0.3); }
  .toggle-switch::after { content:''; position:absolute; width:12px; height:12px;
    background:var(--muted); border-radius:50%; top:3px; left:3px; transition:transform 0.2s,background 0.2s; }
  .toggle-switch.on::after { transform:translateX(14px); background:var(--accent); }
</style>
</head>
<body>

<header>
  <h1>VoiceBot</h1>
  <span class="tag">Demo</span>
</header>

<!-- STT Mode toggle -->
<div class="mode-bar">
  <button class="mode-btn active" id="btnWebkit" onclick="setMode('webkit')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
    WebKit
  </button>
  <div class="mode-divider"></div>
  <button class="mode-btn" id="btnWhisper" onclick="setMode('whisper')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Whisper
  </button>
  <div class="mode-divider"></div>
  <button class="mode-btn" id="btnVosk" onclick="setMode('vosk')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h3l3-9 6 18 3-9h3"/></svg>
    Vosk
  </button>
</div>

<!-- Whisper panel -->
<div class="whisper-panel" id="whisperPanel">
  <div class="whisper-inner">
    <div class="whisper-title">Local model</div>
    <div class="backend-bar">
      <button class="backend-btn active" id="btnWasm" onclick="setDevice('wasm')">WASM <span class="badge">CPU</span></button>
      <button class="backend-btn"        id="btnWebgpu" onclick="setDevice('webgpu')">WebGPU <span class="badge">GPU</span></button>
    </div>
    <div class="model-selector">
      <button class="model-choice active" data-model="onnx-community/whisper-small"           data-size="~180 MB" onclick="selectModel(this)">small</button>
      <button class="model-choice"        data-model="onnx-community/whisper-medium-ONNX"     data-size="~450 MB" onclick="selectModel(this)">medium</button>
      <button class="model-choice"        data-model="onnx-community/whisper-large-v3-turbo"  data-size="~600 MB" data-webgpu-only="1" onclick="selectModel(this)">turbo</button>
      <button class="model-choice"        data-model="onnx-community/mms-1b-all-ONNX"         data-size="~545 MB" data-suffix="q4f16/q4 · Wav2Vec2-CTC · 1000+ langs" onclick="selectModel(this)">mms-1b</button>
    </div>
    <div class="model-info">
      <div>
        <div class="model-name" id="modelName">onnx-community/whisper-small</div>
        <div class="model-size" id="modelSizeLabel">~180 MB · q4 quantized · multilingual</div>
      </div>
      <button class="download-btn" id="downloadBtn" onclick="loadWhisperModel()">Download & load</button>
    </div>
    <div class="model-ready" id="modelReady">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="modelReadyLabel">Model loaded — ready for local inference</span>
    </div>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
</div>

<!-- Vosk panel -->
<div class="whisper-panel" id="voskPanel">
  <div class="whisper-inner">
    <div class="whisper-title">Vosk · streaming partials</div>
    <div class="vosk-presets">
      <button class="vosk-preset" onclick="installVoskPreset('nano')">UK · Nano (73 MB)</button>
      <button class="vosk-preset" onclick="installVoskPreset('small')">UK · Small (133 MB)</button>
    </div>
    <div class="vosk-or">or paste a tar.gz / zip URL</div>
    <input class="vosk-url-input" id="voskUrlInput" type="text"
           placeholder="https://your-host.example/vosk-model.tar.gz">
    <div class="model-info">
      <div>
        <div class="model-name">Self-hosted Kaldi · tar.gz</div>
        <div class="model-size">Continuous · per-phrase finals · ~50–325 MB</div>
      </div>
      <button class="download-btn" id="voskLoadBtn" onclick="loadVoskModel()">Download & load</button>
    </div>
    <div class="model-ready" id="voskReady">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="voskReadyLabel">Vosk model loaded — ready</span>
    </div>
    <div class="progress-label" id="voskProgressLabel"></div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot idle" id="statusDot"></div>
  <span class="status-text" id="statusText">ready</span>
  <span class="interim-text" id="interimText"></span>
</div>

<!-- Chat -->
<div class="chat-window" id="chatWindow"></div>

<!-- Controls -->
<div class="controls">
  <button class="mic-btn" id="micBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <div class="input-wrap">
    <input class="text-input" id="textInput" type="text" placeholder="Введіть повідомлення...">
    <button class="send-btn" id="sendBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="footer-row">
  <span class="browser-note" id="browserNote"></span>
</div>

<script type="module">
// ── Transformers.js CDN import ───────────────────────────────────
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
// Cache models in browser IndexedDB
env.allowLocalModels = false;

// ── State ────────────────────────────────────────────────────────
let sttMode        = 'webkit';   // 'webkit' | 'whisper' | 'vosk'
let isListening    = false;
let recognition    = null;
let whisperPipe    = null;
let whisperLoading = false;
let selectedModel  = 'onnx-community/whisper-small';
let selectedDevice = 'wasm';     // 'wasm' | 'webgpu'
let loadedModels   = {}; // cache: `${modelId}::${device}` -> pipeline
let mediaRecorder  = null;
let audioChunks    = [];

// Vosk state
const VOSK_SDK_URL = 'https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js';
const VOSK_PRESETS = {
  nano:  { url: 'https://huggingface.co/Yehor/vosk-uk/resolve/main/uk_v3_dynamic_nano.zip',  label: 'UK Nano',  size: 73  },
  small: { url: 'https://huggingface.co/Yehor/vosk-uk/resolve/main/uk_v3_dynamic_small.zip', label: 'UK Small', size: 133 },
};
let voskModel      = null;
let voskRecognizer = null;
let voskAudioCtx   = null;
let voskSource     = null;
let voskProcessor  = null;
let voskLoading    = false;
let voskPhraseStart = 0;

const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const SR       = window.SpeechRecognition || window.webkitSpeechRecognition;
const webgpuSupported = typeof navigator !== 'undefined' && !!navigator.gpu;
const cacheKey = (model, device) => `${model}::${device}`;

// ── DOM ──────────────────────────────────────────────────────────
const chatWindow   = document.getElementById('chatWindow');
const micBtn       = document.getElementById('micBtn');
const textInput    = document.getElementById('textInput');
const sendBtn      = document.getElementById('sendBtn');
const statusDot    = document.getElementById('statusDot');
const statusText   = document.getElementById('statusText');
const interimEl    = document.getElementById('interimText');
const browserNote  = document.getElementById('browserNote');
const whisperPanel = document.getElementById('whisperPanel');
const downloadBtn  = document.getElementById('downloadBtn');
const progressBar  = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');
const progressLabel= document.getElementById('progressLabel');
const modelReady   = document.getElementById('modelReady');
const voskPanel    = document.getElementById('voskPanel');
const voskUrlInput = document.getElementById('voskUrlInput');
const voskLoadBtn  = document.getElementById('voskLoadBtn');
const voskReady    = document.getElementById('voskReady');
const voskProgressLabel = document.getElementById('voskProgressLabel');

// ── Expose globals for onclick ───────────────────────────────────
window.setMode = setMode;
window.loadWhisperModel = loadWhisperModel;
window.selectModel = selectModel;
window.setDevice = setDevice;
window.loadVoskModel = loadVoskModel;
window.installVoskPreset = installVoskPreset;

// ── UI helpers ───────────────────────────────────────────────────
function setStatus(state, label) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = label;
}

function formatMeta(meta) {
  const parts = [];
  if (meta.engine) parts.push(meta.engine);
  if (meta.device) parts.push(meta.device);
  if (meta.audioSec != null) parts.push(meta.audioSec.toFixed(1) + 's audio');
  if (meta.sttMs != null) {
    parts.push(meta.sttMs < 1000 ? Math.round(meta.sttMs) + 'ms'
                                 : (meta.sttMs / 1000).toFixed(2) + 's');
  }
  return parts.join(' · ');
}

function addMessage(text, role, meta) {
  const wrap = document.createElement('div');
  wrap.className = 'message ' + role;
  const metaHtml = meta ? `<div class="message-meta">${formatMeta(meta)}</div>` : '';
  wrap.innerHTML = `<span class="message-label">${role === 'user' ? 'ви' : 'assistant'}</span>
    <div class="message-bubble">${text}</div>${metaHtml}`;
  chatWindow.appendChild(wrap);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

// Short, human-readable model label e.g. "whisper-small" → "small"
function modelLabel(id) {
  return id.split('/').pop().replace(/^whisper-/, '').replace(/-ONNX$/, '');
}

// Architecture family — controls dtype layout and inference options.
function modelArch(id) {
  return id.toLowerCase().includes('mms') ? 'mms' : 'whisper';
}

// Per-model dtype config: Whisper has a split encoder/decoder, MMS is one block.
function dtypeFor(model, device) {
  if (modelArch(model) === 'mms') {
    return device === 'webgpu' ? 'q4f16' : 'q4';
  }
  return { encoder_model: 'q4', decoder_model_merged: 'q4' };
}

// Per-model call options. MMS's tokenizer is set up at load time, not per call.
function asrCallOptions(model) {
  if (modelArch(model) === 'mms') return {};
  return { language: 'uk', task: 'transcribe', chunk_length_s: 30 };
}

// ── Mode toggle ──────────────────────────────────────────────────
function setMode(mode) {
  sttMode = mode;
  document.getElementById('btnWebkit').classList.toggle('active', mode === 'webkit');
  document.getElementById('btnWhisper').classList.toggle('active', mode === 'whisper');
  document.getElementById('btnVosk').classList.toggle('active', mode === 'vosk');
  whisperPanel.classList.toggle('visible', mode === 'whisper');
  voskPanel.classList.toggle('visible', mode === 'vosk');
  stopListening();

  if (mode === 'webkit' && !SR) {
    browserNote.textContent = '⚠ WebKit STT not supported — use Chrome/Edge/Safari on HTTPS';
    browserNote.style.color = 'var(--danger)';
    updateMicState();
  } else if (mode === 'webkit') {
    browserNote.textContent = isSafari ? 'Safari: HTTPS required for STT' : 'Chrome/Edge: audio sent to Google';
    browserNote.style.color = '';
    updateMicState();
  } else if (mode === 'whisper') {
    // Whisper mode — defer to refreshModelUI so the note reflects device + load state
    refreshModelUI();
  } else {
    // Vosk mode
    if (voskModel) {
      browserNote.textContent = 'Vosk loaded — fully local, streaming partials';
      browserNote.style.color = 'var(--success)';
    } else {
      browserNote.textContent = 'Paste a Vosk tar.gz URL to load streaming model';
      browserNote.style.color = '';
    }
    updateMicState();
  }
}

function updateMicState() {
  if (sttMode === 'whisper') {
    micBtn.disabled = !whisperPipe;
    micBtn.title = whisperPipe ? 'Click to record' : 'Load model first';
  } else if (sttMode === 'vosk') {
    micBtn.disabled = !voskModel;
    micBtn.title = voskModel ? 'Click to start streaming · click again to stop' : 'Load model first';
  } else {
    micBtn.disabled = !SR;
    micBtn.title = SR ? 'Click to listen' : 'STT not supported';
  }
}

// ── Transcript handler ───────────────────────────────────────────
function handleUserMessage(text, meta) {
  if (!text.trim()) return;
  addMessage(text, 'user', meta);
  textInput.value = '';
  interimEl.textContent = '';
}

// ══════════════════════════════════════════════════════════════════
// WEBKIT STT
// ══════════════════════════════════════════════════════════════════
const PAUSE_RESTARTS = 3;
let pauseRestartCount = 0;
let accumulatedTranscript = '';
let audioCtxUnlocked = false;
let webkitRecordStart = 0;

function webkitMeta() {
  return {
    engine: 'WebKit',
    audioSec: webkitRecordStart ? (performance.now() - webkitRecordStart) / 1000 : null,
  };
}

function unlockAudioContext() {
  if (audioCtxUnlocked || !isIOS) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    audioCtxUnlocked = true;
  } catch(e) {}
}

function buildRecognition() {
  if (!SR) return null;
  const r = new SR();
  r.lang = 'uk-UA';
  r.continuous = false;
  r.interimResults = !isSafari;
  r.maxAlternatives = 1;
  return r;
}

function attachWebkitHandlers() {
  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('active');
    setStatus('listening', pauseRestartCount === 0 ? 'listening...' : 'still listening...');
  };
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    interimEl.textContent = interim || (accumulatedTranscript + ' ' + final).trim();
    if (final) accumulatedTranscript = (accumulatedTranscript + ' ' + final).trim();
  };
  recognition.onerror = (e) => {
    if (e.error === 'no-speech' && pauseRestartCount < PAUSE_RESTARTS) return;
    isListening = false; micBtn.classList.remove('active');
    if (e.error === 'not-allowed') {
      setStatus('idle', 'mic blocked');
      browserNote.textContent = '⚠ Mic denied — check browser settings';
      browserNote.style.color = 'var(--danger)';
    } else if (e.error === 'no-speech') {
      if (accumulatedTranscript) {
        const meta = webkitMeta();
        textInput.value = accumulatedTranscript;
        handleUserMessage(accumulatedTranscript, meta);
      } else setStatus('idle', 'no speech detected');
    } else { setStatus('idle', 'ready'); }
  };
  recognition.onend = () => {
    isListening = false;
    if (pauseRestartCount < PAUSE_RESTARTS && micBtn.classList.contains('active')) {
      pauseRestartCount++;
      recognition = buildRecognition();
      attachWebkitHandlers();
      try { recognition.start(); } catch(e) {}
      return;
    }
    micBtn.classList.remove('active');
    interimEl.textContent = '';
    const final = accumulatedTranscript;
    const meta = final ? webkitMeta() : null;
    accumulatedTranscript = ''; pauseRestartCount = 0; webkitRecordStart = 0;
    if (final) { textInput.value = final; handleUserMessage(final, meta); }
    setStatus('idle', final ? 'ready' : 'no speech detected');
  };
}

function startWebkit() {
  recognition = buildRecognition();
  if (!recognition || isListening) return;
  accumulatedTranscript = ''; pauseRestartCount = 0;
  webkitRecordStart = performance.now();
  unlockAudioContext();
  attachWebkitHandlers();
  try { recognition.start(); } catch(e) { console.warn(e); setStatus('idle', 'ready'); }
}

function stopWebkit() {
  if (recognition && isListening) try { recognition.stop(); } catch(e) {}
}

function selectModel(btn) {
  // Don't allow switching while loading, or if disabled (e.g. turbo on WASM)
  if (whisperLoading || btn.disabled) return;
  document.querySelectorAll('.model-choice').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedModel = btn.dataset.model;
  const size = btn.dataset.size;
  const suffix = btn.dataset.suffix || 'q4 quantized · multilingual';
  document.getElementById('modelName').textContent = selectedModel;
  document.getElementById('modelSizeLabel').textContent = size + ' · ' + suffix;
  refreshModelUI();
}

function setDevice(device) {
  if (whisperLoading) return;
  if (device === 'webgpu' && !webgpuSupported) return;
  selectedDevice = device;
  document.getElementById('btnWasm').classList.toggle('active', device === 'wasm');
  document.getElementById('btnWebgpu').classList.toggle('active', device === 'webgpu');

  // If the currently selected model is WebGPU-only and we're switching to WASM, fall back to small
  const activeBtn = document.querySelector('.model-choice.active');
  if (activeBtn && activeBtn.dataset.webgpuOnly === '1' && device !== 'webgpu') {
    document.querySelectorAll('.model-choice').forEach(b => b.classList.remove('active'));
    const fallbackBtn = document.querySelector('.model-choice[data-model="onnx-community/whisper-small"]');
    fallbackBtn.classList.add('active');
    selectedModel = fallbackBtn.dataset.model;
    const fbSuffix = fallbackBtn.dataset.suffix || 'q4 quantized · multilingual';
    document.getElementById('modelName').textContent = selectedModel;
    document.getElementById('modelSizeLabel').textContent = fallbackBtn.dataset.size + ' · ' + fbSuffix;
  }
  refreshModelUI();
}

function refreshModelUI() {
  // Sync per-button "loaded" and disabled state to the current device
  document.querySelectorAll('.model-choice').forEach(b => {
    b.classList.toggle('loaded', !!loadedModels[cacheKey(b.dataset.model, selectedDevice)]);
    if (b.dataset.webgpuOnly === '1') {
      b.disabled = (selectedDevice !== 'webgpu');
      b.title = b.disabled ? 'Requires WebGPU backend' : '';
    }
  });

  // Sync the active-model panel (ready vs. needs-download)
  const key = cacheKey(selectedModel, selectedDevice);
  const deviceLabel = selectedDevice === 'webgpu' ? 'WebGPU' : 'WASM';
  if (loadedModels[key]) {
    whisperPipe = loadedModels[key];
    modelReady.classList.add('visible');
    document.getElementById('modelReadyLabel').textContent = `${selectedModel.split('/')[1]} loaded ✓ (${deviceLabel})`;
    downloadBtn.style.display = 'none';
    progressLabel.textContent = '';
    progressWrap.style.display = 'none';
    browserNote.textContent = `Model loaded — fully local (${deviceLabel})`;
    browserNote.style.color = 'var(--success)';
  } else {
    whisperPipe = null;
    modelReady.classList.remove('visible');
    downloadBtn.style.display = '';
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download & load';
    progressLabel.textContent = '';
    progressWrap.style.display = 'none';
    browserNote.textContent = `Download model to enable local STT (${deviceLabel})`;
    browserNote.style.color = '';
  }
  updateMicState();
}

async function loadWhisperModel() {
  const key = cacheKey(selectedModel, selectedDevice);
  if (loadedModels[key] || whisperLoading) return;
  whisperLoading = true;
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Loading...';
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  const deviceLabel = selectedDevice === 'webgpu' ? 'WebGPU' : 'WASM';
  progressLabel.textContent = `Starting download (${deviceLabel})...`;
  setStatus('loading', 'downloading model...');

  try {
    const pipe = await pipeline(
      'automatic-speech-recognition',
      selectedModel,
      {
        device: selectedDevice,
        dtype: dtypeFor(selectedModel, selectedDevice),
        progress_callback: (p) => {
          if (p.status === 'downloading' || p.status === 'progress') {
            const pct = p.progress ? Math.round(p.progress) : 0;
            progressBar.style.width = pct + '%';
            const mb = p.loaded ? (p.loaded / 1024 / 1024).toFixed(1) : '?';
            const total = p.total ? (p.total / 1024 / 1024).toFixed(1) : '?';
            progressLabel.textContent = `${p.file || ''} — ${mb} / ${total} MB (${pct}%)`;
          } else if (p.status === 'done') {
            progressLabel.textContent = `✓ ${p.file || 'file'} loaded`;
          } else if (p.status === 'initiate') {
            progressLabel.textContent = `Fetching ${p.file || ''}...`;
          }
        }
      }
    );
    // MMS uses language-specific tokenizer adapters — wire Ukrainian on load.
    if (modelArch(selectedModel) === 'mms') {
      try { pipe.tokenizer.target_lang = 'ukr'; }
      catch (e) { console.warn('Could not set MMS target_lang:', e); }
    }
    loadedModels[key] = pipe;
    whisperPipe = pipe;
    whisperLoading = false;
    progressBar.style.width = '100%';
    progressLabel.textContent = `Model ready! (${deviceLabel})`;
    modelReady.classList.add('visible');
    document.getElementById('modelReadyLabel').textContent = `${selectedModel.split('/')[1]} loaded ✓ (${deviceLabel})`;
    downloadBtn.style.display = 'none';
    // Mark the active button as loaded for this device
    document.querySelectorAll('.model-choice').forEach(b => {
      if (b.dataset.model === selectedModel) b.classList.add('loaded');
    });
    browserNote.textContent = `Model loaded — fully local, no data sent anywhere (${deviceLabel})`;
    browserNote.style.color = 'var(--success)';
    setStatus('idle', 'ready');
    updateMicState();
  } catch(err) {
    console.error(err);
    progressLabel.textContent = '⚠ Load failed: ' + err.message;
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Retry';
    whisperLoading = false;
    whisperPipe = null;
    setStatus('idle', 'load failed');
  }
}

// VAD config — adaptive (calibrated to ambient noise floor each session)
const VAD_CALIBRATE_MS    = 400;   // measure ambient noise for this long after start
const VAD_SPEECH_MARGIN   = 10;    // dB above noise floor → speech onset
const VAD_SILENCE_MARGIN  = 4;     // dB above noise floor → back to silence
const VAD_SILENCE_MS      = 1200;  // sustained silence before stopping
const VAD_MIN_SPEECH_MS   = 250;   // ignore utterances shorter than this
const VAD_SMOOTH          = 0.3;   // EMA factor for dB smoothing

let silenceTimer  = null;
let analyser      = null;
let vadFrame      = null;
let speechStarted = false;
let speechStartTs = 0;
let activeStream  = null;
let calibrating   = false;
let calibStart    = 0;
let noiseSamples  = [];
let noiseFloor    = -55;          // sensible default before calibration
let smoothedDb    = null;

function dbFromAnalyser() {
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) {
    const s = (buf[i] - 128) / 128;
    sum += s * s;
  }
  const rms = Math.sqrt(sum / buf.length);
  return rms > 0 ? 20 * Math.log10(rms) : -Infinity;
}

async function startWhisper() {
  if (!whisperPipe || isListening) return;
  activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioChunks = [];

  // Set up analyser for VAD
  const audioCtxVad = new AudioContext();
  const source = audioCtxVad.createMediaStreamSource(activeStream);
  analyser = audioCtxVad.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  mediaRecorder = new MediaRecorder(activeStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    cancelAnimationFrame(vadFrame);
    clearTimeout(silenceTimer);
    activeStream.getTracks().forEach(t => t.stop());
    audioCtxVad.close();

    if (audioChunks.length === 0) {
      setStatus('idle', 'ready');
      micBtn.classList.remove('active');
      isListening = false;
      return;
    }

    setStatus('loading', 'transcribing...');
    micBtn.classList.remove('active');
    isListening = false;

    try {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const arrayBuffer = await blob.arrayBuffer();
      const audioCtx = new AudioContext({ sampleRate: 16000 });
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      const float32 = decoded.getChannelData(0);
      const audioSec = decoded.duration;
      const sttStart = performance.now();
      const result = await whisperPipe(float32, asrCallOptions(selectedModel));
      const sttMs = performance.now() - sttStart;
      const transcript = result.text.trim();
      interimEl.textContent = '';
      if (transcript) {
        const meta = {
          engine: modelLabel(selectedModel),
          device: selectedDevice === 'webgpu' ? 'WebGPU' : 'WASM',
          audioSec,
          sttMs,
        };
        textInput.value = transcript;
        handleUserMessage(transcript, meta);
        setStatus('idle', 'ready');
      }
      else setStatus('idle', 'no speech detected');
    } catch(err) {
      console.error(err);
      setStatus('idle', 'transcription failed');
    }
  };

  // Reset VAD state for this session
  speechStarted = false;
  speechStartTs = 0;
  silenceTimer  = null;
  calibrating   = true;
  calibStart    = performance.now();
  noiseSamples  = [];
  smoothedDb    = null;
  noiseFloor    = -55;

  mediaRecorder.start();
  isListening = true;
  micBtn.classList.add('active');
  setStatus('listening', 'calibrating mic...');

  function vadTick() {
    if (!isListening) return;
    const raw = dbFromAnalyser();
    // EMA smoothing — kills single-frame spikes/dips
    smoothedDb = (smoothedDb == null) ? raw : (smoothedDb * (1 - VAD_SMOOTH) + raw * VAD_SMOOTH);

    // ── Phase 1: calibrate noise floor ──
    if (calibrating) {
      noiseSamples.push(smoothedDb);
      if (performance.now() - calibStart >= VAD_CALIBRATE_MS) {
        calibrating = false;
        const sorted = [...noiseSamples].sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];
        // Clamp to a sane range so a weird outlier can't break detection
        noiseFloor = Math.max(-70, Math.min(-25, median ?? -55));
        setStatus('listening', 'waiting for speech...');
      }
      vadFrame = requestAnimationFrame(vadTick);
      return;
    }

    // ── Phase 2: detect speech against the measured floor ──
    const speechThreshold  = noiseFloor + VAD_SPEECH_MARGIN;
    const silenceThreshold = noiseFloor + VAD_SILENCE_MARGIN;

    if (!speechStarted) {
      if (smoothedDb > speechThreshold) {
        speechStarted = true;
        speechStartTs = performance.now();
        setStatus('listening', 'recording...');
        interimEl.textContent = '🎙';
      }
    } else {
      if (smoothedDb < silenceThreshold) {
        // Silence — arm the stop timer (cancelled if sound returns before it fires)
        if (!silenceTimer) {
          silenceTimer = setTimeout(() => {
            const speechMs = performance.now() - speechStartTs;
            if (speechMs > VAD_MIN_SPEECH_MS) stopWhisper();
            else {
              // Too short to be real speech — reset and keep listening
              silenceTimer = null;
              speechStarted = false;
              speechStartTs = 0;
              setStatus('listening', 'waiting for speech...');
              interimEl.textContent = '';
            }
          }, VAD_SILENCE_MS);
        }
      } else {
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        interimEl.textContent = '🎙';
      }
    }
    vadFrame = requestAnimationFrame(vadTick);
  }
  vadFrame = requestAnimationFrame(vadTick);
}

function stopWhisper() {
  clearTimeout(silenceTimer);
  silenceTimer = null;
  cancelAnimationFrame(vadFrame);
  interimEl.textContent = '';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else {
    isListening = false;
    micBtn.classList.remove('active');
    setStatus('idle', 'ready');
  }
}

// ══════════════════════════════════════════════════════════════════
// VOSK (streaming)
// ══════════════════════════════════════════════════════════════════

// Minimal USTAR tar packer — regular files only, filenames ≤ 99 chars.
// Vosk model paths comfortably fit; throws if a longer name appears.
function packTar(entries) {
  const enc = new TextEncoder();
  const names = Object.keys(entries);
  let total = 0;
  for (const n of names) total += 512 + Math.ceil(entries[n].length / 512) * 512;
  total += 1024; // two trailing zero blocks
  const out = new Uint8Array(total);
  let pos = 0;
  for (const n of names) {
    const data = entries[n];
    if (n.length > 99) throw new Error('tar: filename too long: ' + n);
    const h = new Uint8Array(512);
    h.set(enc.encode(n), 0);
    h.set(enc.encode('000644 \0'), 100);
    h.set(enc.encode('000000 \0'), 108);
    h.set(enc.encode('000000 \0'), 116);
    h.set(enc.encode(data.length.toString(8).padStart(11, '0') + '\0'), 124);
    h.set(enc.encode('00000000000\0'), 136);
    h.set(enc.encode('        '), 148);          // checksum placeholder
    h[156] = 0x30;                                // typeflag '0' (regular)
    h.set(enc.encode('ustar\0'), 257);
    h.set(enc.encode('00'), 263);
    let cks = 0;
    for (let i = 0; i < 512; i++) cks += h[i];
    h.set(enc.encode(cks.toString(8).padStart(6, '0') + '\0 '), 148);
    out.set(h, pos); pos += 512;
    out.set(data, pos); pos += data.length;
    pos = Math.ceil(pos / 512) * 512;
  }
  return out;
}

// Repack a Vosk model zip as tar.gz in memory; vosk-browser only accepts tar.gz.
async function zipToTarGzBlobUrl(zipBytes, onProgress) {
  const fflate = await import('https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm');
  onProgress?.('Extracting zip...');
  const entries = await new Promise((res, rej) =>
    fflate.unzip(zipBytes, (err, data) => err ? rej(err) : res(data)));
  // Drop directory placeholders; keep only file entries with content
  const files = {};
  for (const [name, data] of Object.entries(entries)) {
    if (!name.endsWith('/') && data.length >= 0) files[name] = data;
  }
  onProgress?.('Repacking as tar...');
  const tar = packTar(files);
  onProgress?.('Compressing tar.gz...');
  const targz = await new Promise((res, rej) =>
    fflate.gzip(tar, { level: 1 }, (err, data) => err ? rej(err) : res(data)));
  return URL.createObjectURL(new Blob([targz], { type: 'application/gzip' }));
}

// Stream a URL with a fetch + reader so we can show download progress.
async function fetchWithProgress(url, onProgress) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const total = Number(resp.headers.get('content-length')) || 0;
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    onProgress?.(received, total);
  }
  const out = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

async function installVoskPreset(key) {
  const preset = VOSK_PRESETS[key];
  if (!preset || voskLoading || voskModel) return;
  await runVoskInstall(preset.url, preset.label, preset.size);
}

// Shared install pipeline for both presets and the manual URL field
async function runVoskInstall(url, label, sizeHintMb) {
  voskLoading = true;
  document.querySelectorAll('.vosk-preset').forEach(b => b.disabled = true);
  voskLoadBtn.disabled = true;
  voskLoadBtn.textContent = 'Installing...';
  setStatus('loading', `installing ${label}...`);
  voskProgressLabel.textContent = `Downloading ${label}${sizeHintMb ? ` (~${sizeHintMb} MB)` : ''}...`;

  try {
    const isZip = /\.zip(?:$|\?)/i.test(url);
    const bytes = await fetchWithProgress(url, (received, total) => {
      const mb = (received / 1024 / 1024).toFixed(1);
      if (total) {
        const totalMb = (total / 1024 / 1024).toFixed(1);
        const pct = Math.round(received / total * 100);
        voskProgressLabel.textContent = `Downloading — ${mb} / ${totalMb} MB (${pct}%)`;
      } else {
        voskProgressLabel.textContent = `Downloading — ${mb} MB`;
      }
    });

    let modelUrl;
    if (isZip) {
      modelUrl = await zipToTarGzBlobUrl(bytes, (msg) => { voskProgressLabel.textContent = msg; });
    } else {
      // Already tar.gz — wrap in blob URL so vosk-browser fetches from memory
      modelUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/gzip' }));
    }

    voskProgressLabel.textContent = 'Loading model into Vosk...';
    await loadVoskScript();
    voskModel = await window.Vosk.createModel(modelUrl);

    voskProgressLabel.textContent = `✓ ${label} ready — streaming enabled`;
    voskReady.classList.add('visible');
    voskLoadBtn.style.display = 'none';
    document.querySelectorAll('.vosk-preset').forEach(b => b.style.display = 'none');
    voskLoading = false;
    browserNote.textContent = 'Vosk loaded — fully local, streaming partials';
    browserNote.style.color = 'var(--success)';
    setStatus('idle', 'ready');
    updateMicState();
  } catch (err) {
    console.error(err);
    voskProgressLabel.textContent = '⚠ Install failed: ' + (err.message || err);
    document.querySelectorAll('.vosk-preset').forEach(b => b.disabled = false);
    voskLoadBtn.disabled = false;
    voskLoadBtn.textContent = 'Retry';
    voskLoading = false;
    voskModel = null;
    setStatus('idle', 'install failed');
  }
}

function loadVoskScript() {
  if (window.Vosk) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = VOSK_SDK_URL;
    s.onload = () => res();
    s.onerror = () => rej(new Error('Failed to load vosk-browser SDK from CDN'));
    document.head.appendChild(s);
  });
}

async function loadVoskModel() {
  const url = voskUrlInput.value.trim();
  if (!url) { voskProgressLabel.textContent = '⚠ Paste a model URL first'; return; }
  if (voskLoading || voskModel) return;
  localStorage.setItem('voskModelUrl', url);
  await runVoskInstall(url, 'custom model');
}

async function startVosk() {
  if (!voskModel || isListening) return;
  try {
    activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    voskAudioCtx = new AudioContext();
    voskSource = voskAudioCtx.createMediaStreamSource(activeStream);

    voskRecognizer = new voskModel.KaldiRecognizer(voskAudioCtx.sampleRate);
    voskRecognizer.setWords(false);
    voskPhraseStart = 0;

    voskRecognizer.on('result', (msg) => {
      const text = (msg && msg.result && msg.result.text || '').trim();
      if (text) {
        const audioSec = voskPhraseStart ? (performance.now() - voskPhraseStart) / 1000 : null;
        handleUserMessage(text, { engine: 'Vosk', audioSec });
      }
      voskPhraseStart = 0;
      interimEl.textContent = '';
    });
    voskRecognizer.on('partialresult', (msg) => {
      const partial = (msg && msg.result && msg.result.partial || '').trim();
      if (partial && !voskPhraseStart) voskPhraseStart = performance.now();
      interimEl.textContent = partial;
    });

    voskProcessor = voskAudioCtx.createScriptProcessor(4096, 1, 1);
    voskProcessor.onaudioprocess = (e) => {
      try { voskRecognizer.acceptWaveform(e.inputBuffer); } catch (err) { /* swallow */ }
    };
    voskSource.connect(voskProcessor);
    voskProcessor.connect(voskAudioCtx.destination);

    isListening = true;
    micBtn.classList.add('active');
    setStatus('listening', 'streaming (click mic to stop)');
  } catch (err) {
    console.error(err);
    setStatus('idle', 'mic failed');
    isListening = false;
    micBtn.classList.remove('active');
  }
}

function stopVosk() {
  if (voskProcessor) { try { voskProcessor.disconnect(); } catch (e) {} voskProcessor = null; }
  if (voskSource)    { try { voskSource.disconnect();    } catch (e) {} voskSource = null; }
  if (voskAudioCtx && voskAudioCtx.state !== 'closed') {
    try { voskAudioCtx.close(); } catch (e) {}
    voskAudioCtx = null;
  }
  if (activeStream)  { activeStream.getTracks().forEach(t => t.stop()); activeStream = null; }
  if (voskRecognizer) { try { voskRecognizer.remove(); } catch (e) {} voskRecognizer = null; }
  voskPhraseStart = 0;
  interimEl.textContent = '';
  if (isListening) {
    isListening = false;
    micBtn.classList.remove('active');
    setStatus('idle', 'ready');
  }
}

// ══════════════════════════════════════════════════════════════════
// Unified mic control
// ══════════════════════════════════════════════════════════════════
function startListening() {
  if (sttMode === 'whisper') startWhisper();
  else if (sttMode === 'vosk') startVosk();
  else startWebkit();
}

function stopListening() {
  if (sttMode === 'whisper') stopWhisper();
  else if (sttMode === 'vosk') stopVosk();
  else stopWebkit();
}

micBtn.addEventListener('click', () => {
  if (isListening) stopListening();
  else startListening();
});

sendBtn.addEventListener('click', () => handleUserMessage(textInput.value));
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleUserMessage(textInput.value); });

// ── Init ─────────────────────────────────────────────────────────
// WebGPU detection — disable the button if unsupported, default to it when available
if (!webgpuSupported) {
  const btn = document.getElementById('btnWebgpu');
  btn.disabled = true;
  btn.title = 'WebGPU not supported in this browser (Safari/Firefox)';
} else {
  setDevice('webgpu');
}
refreshModelUI();

// Restore last-used Vosk model URL so the user doesn't retype between reloads
voskUrlInput.value = localStorage.getItem('voskModelUrl') || '';
voskUrlInput.addEventListener('change', () => {
  localStorage.setItem('voskModelUrl', voskUrlInput.value.trim());
});

setMode('webkit');
setStatus('idle', 'ready');
</script>
</body>
