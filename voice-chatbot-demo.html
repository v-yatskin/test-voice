<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBot Demo</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10; --surface: #111318; --border: #1e2229;
    --accent: #00e5ff; --accent2: #7c4dff;
    --text: #e8eaf0; --muted: #4a5060;
    --user-bg: #0d1f2d; --bot-bg: #13101f;
    --danger: #ff3d6b; --success: #00e5a0; --warn: #ffb300;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 24px 16px;
    background-image:
      radial-gradient(ellipse 60% 40% at 70% 10%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 20% 80%, rgba(124,77,255,0.05) 0%, transparent 60%);
  }
  header { width:100%; max-width:680px; margin-bottom:20px; display:flex; align-items:baseline; gap:12px; }
  header h1 { font-family:'Syne',sans-serif; font-weight:800; font-size:1.4rem; letter-spacing:-0.02em; }
  .tag { font-size:0.65rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--accent); border:1px solid rgba(0,229,255,0.3); padding:2px 8px; border-radius:2px; }

  /* STT mode toggle */
  .mode-bar {
    width:100%; max-width:680px; display:flex; align-items:center; gap:8px;
    margin-bottom:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:4px; position:relative;
  }
  .mode-btn {
    flex:1; padding:8px; border:none; background:transparent; cursor:pointer;
    font-family:'JetBrains Mono',monospace; font-size:0.72rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted); border-radius:4px; transition:all 0.2s;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .mode-btn.active { background:rgba(0,229,255,0.1); color:var(--accent); }
  .mode-btn svg { width:14px; height:14px; }
  .mode-divider { width:1px; height:24px; background:var(--border); flex-shrink:0; }

  /* Whisper download panel */
  .whisper-panel {
    width:100%; max-width:680px; margin-bottom:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:6px;
    overflow:hidden; display:none;
  }
  .whisper-panel.visible { display:block; }
  .whisper-inner { padding:14px 16px; }
  .whisper-title { font-size:0.72rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:10px; }
  .model-info { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .model-name { font-size:0.8rem; color:var(--text); }
  .model-size { font-size:0.68rem; color:var(--muted); }
  .download-btn {
    padding:8px 16px; background:rgba(0,229,255,0.1); border:1px solid rgba(0,229,255,0.3);
    color:var(--accent); font-family:'JetBrains Mono',monospace; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; border-radius:4px;
    transition:all 0.2s; white-space:nowrap;
  }
  .download-btn:hover { background:rgba(0,229,255,0.18); }
  .download-btn:disabled { opacity:0.4; cursor:not-allowed; }
  .progress-wrap { height:3px; background:var(--border); border-radius:2px; overflow:hidden; }
  .progress-bar { height:100%; background:var(--accent); width:0%; transition:width 0.2s; border-radius:2px; }
  .progress-label { font-size:0.65rem; color:var(--muted); margin-top:6px; }
  .model-selector { display:flex; gap:6px; margin-bottom:12px; }
  .model-choice {
    flex:1; padding:6px 0; background:transparent; border:1px solid var(--border);
    color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.08em; cursor:pointer; border-radius:4px;
    transition:all 0.2s;
  }
  .model-choice:hover { border-color:var(--accent); color:var(--accent); }
  .model-choice.active { border-color:var(--accent); color:var(--accent); background:rgba(0,229,255,0.08); }
  .model-choice.loaded { border-color:var(--success); color:var(--success); background:rgba(0,229,165,0.08); }
  .model-ready { display:none; align-items:center; gap:8px; font-size:0.72rem; color:var(--success); }
  .model-ready.visible { display:flex; }

  /* Status bar */
  .status-bar {
    width:100%; max-width:680px; display:flex; align-items:center;
    gap:8px; margin-bottom:12px; height:28px;
  }
  .status-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); transition:all 0.3s; flex-shrink:0; }
  .status-dot.listening { background:var(--danger); box-shadow:0 0 8px var(--danger); animation:pulse 1s infinite; }
  .status-dot.speaking  { background:var(--accent);  box-shadow:0 0 8px var(--accent); animation:pulse 1.4s infinite; }
  .status-dot.loading   { background:var(--warn);    box-shadow:0 0 8px var(--warn);   animation:pulse 0.8s infinite; }
  .status-dot.idle      { background:var(--success); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .status-text { font-size:0.7rem; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; }
  .interim-text { font-size:0.7rem; color:var(--accent); opacity:0.7; font-style:italic;
    margin-left:auto; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Chat */
  .chat-window {
    width:100%; max-width:680px; background:var(--surface);
    border:1px solid var(--border); border-radius:8px; padding:20px;
    min-height:320px; max-height:45vh; overflow-y:auto;
    display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth;
  }
  .chat-window::-webkit-scrollbar { width:4px; }
  .chat-window::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .message { display:flex; flex-direction:column; gap:4px; animation:slideIn 0.2s ease-out; }
  @keyframes slideIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .message.user { align-items:flex-end; }
  .message.bot  { align-items:flex-start; }
  .message-label { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
  .message-bubble {
    max-width:80%; padding:10px 14px; border-radius:6px;
    font-size:0.82rem; line-height:1.6;
  }
  .message.user .message-bubble { background:var(--user-bg); border:1px solid rgba(0,229,255,0.15); border-bottom-right-radius:2px; }
  .message.bot  .message-bubble { background:var(--bot-bg);  border:1px solid rgba(124,77,255,0.2); border-bottom-left-radius:2px; }

  /* Controls */
  .controls { width:100%; max-width:680px; margin-top:14px; display:flex; align-items:center; gap:12px; }
  .mic-btn {
    width:56px; height:56px; border-radius:50%; border:2px solid var(--border);
    background:var(--surface); cursor:pointer; display:flex; align-items:center;
    justify-content:center; transition:all 0.2s; flex-shrink:0; position:relative; overflow:hidden;
  }
  .mic-btn::before {
    content:''; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle,rgba(0,229,255,0.15) 0%,transparent 70%);
    opacity:0; transition:opacity 0.2s;
  }
  .mic-btn:hover::before { opacity:1; }
  .mic-btn:hover { border-color:var(--accent); }
  .mic-btn.active { border-color:var(--danger); background:rgba(255,61,107,0.08); animation:ringPulse 1s infinite; }
  .mic-btn:disabled { opacity:0.35; cursor:not-allowed; }
  @keyframes ringPulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,61,107,0.4)} 50%{box-shadow:0 0 0 10px rgba(255,61,107,0)} }
  .mic-btn svg { width:22px; height:22px; transition:all 0.2s; }
  .mic-btn.active svg { stroke:var(--danger); }
  .input-wrap {
    flex:1; display:flex; align-items:center; background:var(--surface);
    border:1px solid var(--border); border-radius:6px; overflow:hidden; transition:border-color 0.2s;
  }
  .input-wrap:focus-within { border-color:rgba(0,229,255,0.3); }
  .text-input {
    flex:1; background:transparent; border:none; outline:none;
    padding:14px 16px; font-family:'JetBrains Mono',monospace; font-size:0.82rem;
    color:var(--text); caret-color:var(--accent);
  }
  .text-input::placeholder { color:var(--muted); }
  .send-btn {
    background:transparent; border:none; border-left:1px solid var(--border);
    padding:0 16px; height:100%; cursor:pointer; color:var(--muted);
    display:flex; align-items:center; transition:color 0.2s,background 0.2s;
  }
  .send-btn:hover { color:var(--accent); background:rgba(0,229,255,0.05); }
  .send-btn svg { width:18px; height:18px; }

  /* Footer */
  .footer-row {
    width:100%; max-width:680px; display:flex; align-items:center;
    justify-content:space-between; margin-top:10px; padding:0 2px;
  }
  .browser-note { font-size:0.62rem; color:var(--muted); letter-spacing:0.05em; }
  .voice-toggle { display:flex; align-items:center; gap:6px; font-size:0.65rem;
    color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; user-select:none; }
  .toggle-switch { width:32px; height:18px; background:var(--border); border-radius:9px;
    position:relative; transition:background 0.2s; cursor:pointer; flex-shrink:0; }
  .toggle-switch.on { background:rgba(0,229,255,0.3); }
  .toggle-switch::after { content:''; position:absolute; width:12px; height:12px;
    background:var(--muted); border-radius:50%; top:3px; left:3px; transition:transform 0.2s,background 0.2s; }
  .toggle-switch.on::after { transform:translateX(14px); background:var(--accent); }
</style>
</head>
<body>

<header>
  <h1>VoiceBot</h1>
  <span class="tag">Demo</span>
</header>

<!-- STT Mode toggle -->
<div class="mode-bar">
  <button class="mode-btn active" id="btnWebkit" onclick="setMode('webkit')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
    WebKit STT
  </button>
  <div class="mode-divider"></div>
  <button class="mode-btn" id="btnWhisper" onclick="setMode('whisper')">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
    Whisper WASM
  </button>
</div>

<!-- Whisper panel -->
<div class="whisper-panel" id="whisperPanel">
  <div class="whisper-inner">
    <div class="whisper-title">Local model</div>
    <div class="model-selector">
      <button class="model-choice active" data-model="onnx-community/whisper-tiny"  data-size="~40 MB"  onclick="selectModel(this)">tiny</button>
      <button class="model-choice"        data-model="onnx-community/whisper-base"  data-size="~80 MB"  onclick="selectModel(this)">base</button>
      <button class="model-choice"        data-model="onnx-community/whisper-small" data-size="~180 MB" onclick="selectModel(this)">small</button>
    </div>
    <div class="model-info">
      <div>
        <div class="model-name" id="modelName">onnx-community/whisper-tiny</div>
        <div class="model-size" id="modelSizeLabel">~40 MB · q4 quantized · multilingual</div>
      </div>
      <button class="download-btn" id="downloadBtn" onclick="loadWhisperModel()">Download & load</button>
    </div>
    <div class="model-ready" id="modelReady">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="modelReadyLabel">Model loaded — ready for local inference</span>
    </div>
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div class="status-dot idle" id="statusDot"></div>
  <span class="status-text" id="statusText">ready</span>
  <span class="interim-text" id="interimText"></span>
</div>

<!-- Chat -->
<div class="chat-window" id="chatWindow">
  <div class="message bot">
    <span class="message-label">assistant</span>
    <div class="message-bubble">Привіт! Я ваш голосовий асистент. Оберіть режим STT вгорі, натисніть мікрофон або введіть повідомлення.</div>
  </div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="mic-btn" id="micBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
  </button>
  <div class="input-wrap">
    <input class="text-input" id="textInput" type="text" placeholder="Введіть повідомлення...">
    <button class="send-btn" id="sendBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>
</div>

<div class="footer-row">
  <span class="browser-note" id="browserNote"></span>
  <label class="voice-toggle">
    <div class="toggle-switch on" id="voiceToggle"></div>
    TTS
  </label>
</div>

<script type="module">
// ── Transformers.js CDN import ───────────────────────────────────
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
// Cache models in browser IndexedDB
env.allowLocalModels = false;

// ── Hardcoded Ukrainian responses ────────────────────────────────
const RESPONSES = [
  "Вітаю! Я отримав ваше повідомлення. У реальному сценарії це пішло б до вашого LLM API.",
  "Цікаво! Цей демо використовує Web Speech API як для розпізнавання мови, так і для відтворення.",
  "Гарне питання. Розпізнавання обробляється браузером — Safari використовує сервери Apple.",
  "Ви можете замінити цю відповідь будь-яким fetch() запитом до вашого бекенду чатботу.",
  "Озвучення повністю локальне — голоси встановлені на вашій ОС, мережевих запитів немає.",
  "Хочете режим вільних рук? Можна налаштувати автоматичний перезапуск мікрофона після відповіді.",
  "Цей підхід добре підходить для ботів підтримки клієнтів — голосовий шар це тонка обгортка над API.",
];
let responseIndex = 0;
const getResponse = () => RESPONSES[responseIndex++ % RESPONSES.length];

// ── State ────────────────────────────────────────────────────────
let sttMode        = 'webkit';   // 'webkit' | 'whisper'
let isListening    = false;
let isSpeaking     = false;
let ttsEnabled     = true;
let recognition    = null;
let whisperPipe    = null;
let whisperLoading = false;
let selectedModel  = 'onnx-community/whisper-tiny';
let loadedModels   = {}; // cache: modelId -> pipeline
let mediaRecorder  = null;
let audioChunks    = [];

const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const isIOS    = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const SR       = window.SpeechRecognition || window.webkitSpeechRecognition;

// ── DOM ──────────────────────────────────────────────────────────
const chatWindow   = document.getElementById('chatWindow');
const micBtn       = document.getElementById('micBtn');
const textInput    = document.getElementById('textInput');
const sendBtn      = document.getElementById('sendBtn');
const statusDot    = document.getElementById('statusDot');
const statusText   = document.getElementById('statusText');
const interimEl    = document.getElementById('interimText');
const voiceToggle  = document.getElementById('voiceToggle');
const browserNote  = document.getElementById('browserNote');
const whisperPanel = document.getElementById('whisperPanel');
const downloadBtn  = document.getElementById('downloadBtn');
const progressBar  = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');
const progressLabel= document.getElementById('progressLabel');
const modelReady   = document.getElementById('modelReady');

// ── Expose globals for onclick ───────────────────────────────────
window.setMode = setMode;
window.loadWhisperModel = loadWhisperModel;
window.selectModel = selectModel;

// ── UI helpers ───────────────────────────────────────────────────
function setStatus(state, label) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = label;
}

function addMessage(text, role) {
  const wrap = document.createElement('div');
  wrap.className = 'message ' + role;
  wrap.innerHTML = `<span class="message-label">${role === 'user' ? 'ви' : 'assistant'}</span>
    <div class="message-bubble">${text}</div>`;
  chatWindow.appendChild(wrap);
  chatWindow.scrollTop = chatWindow.scrollHeight;
}

// ── Mode toggle ──────────────────────────────────────────────────
function setMode(mode) {
  sttMode = mode;
  document.getElementById('btnWebkit').classList.toggle('active', mode === 'webkit');
  document.getElementById('btnWhisper').classList.toggle('active', mode === 'whisper');
  whisperPanel.classList.toggle('visible', mode === 'whisper');
  stopListening();

  if (mode === 'webkit' && !SR) {
    browserNote.textContent = '⚠ WebKit STT not supported — use Chrome/Edge/Safari on HTTPS';
    browserNote.style.color = 'var(--danger)';
  } else if (mode === 'webkit') {
    browserNote.textContent = isSafari ? 'Safari: HTTPS required for STT' : 'Chrome/Edge: audio sent to Google';
    browserNote.style.color = '';
  } else {
    browserNote.textContent = whisperPipe ? 'Model loaded — fully local' : 'Download model to enable local STT';
    browserNote.style.color = whisperPipe ? 'var(--success)' : '';
  }
  updateMicState();
}

function updateMicState() {
  if (sttMode === 'whisper') {
    micBtn.disabled = !whisperPipe;
    micBtn.title = whisperPipe ? 'Click to record' : 'Load model first';
  } else {
    micBtn.disabled = !SR;
    micBtn.title = SR ? 'Click to listen' : 'STT not supported';
  }
}

// ── TTS ──────────────────────────────────────────────────────────
function speak(text, onEnd) {
  if (!ttsEnabled || !window.speechSynthesis) { onEnd?.(); return; }
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'uk-UA'; utt.rate = 1.0; utt.pitch = 1.0;
  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v => v.lang === 'uk-UA' || v.lang === 'uk')
    || voices.find(v => v.name.toLowerCase().includes('ukrain'));
  if (preferred) utt.voice = preferred;
  utt.onstart = () => { isSpeaking = true; setStatus('speaking', 'speaking'); };
  utt.onend   = () => { isSpeaking = false; setStatus('idle', 'ready'); onEnd?.(); };
  utt.onerror = () => { isSpeaking = false; setStatus('idle', 'ready'); onEnd?.(); };
  speechSynthesis.speak(utt);
}

// ── Bot handler ──────────────────────────────────────────────────
function handleUserMessage(text) {
  if (!text.trim()) return;
  addMessage(text, 'user');
  textInput.value = '';
  interimEl.textContent = '';
  setTimeout(() => {
    const reply = getResponse();
    addMessage(reply, 'bot');
    speak(reply);
  }, 300);
}

// ══════════════════════════════════════════════════════════════════
// WEBKIT STT
// ══════════════════════════════════════════════════════════════════
const PAUSE_RESTARTS = 3;
let pauseRestartCount = 0;
let accumulatedTranscript = '';
let audioCtxUnlocked = false;

function unlockAudioContext() {
  if (audioCtxUnlocked || !isIOS) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1,1,22050);
    const src = ctx.createBufferSource();
    src.buffer = buf; src.connect(ctx.destination); src.start(0);
    audioCtxUnlocked = true;
  } catch(e) {}
}

function buildRecognition() {
  if (!SR) return null;
  const r = new SR();
  r.lang = 'uk-UA';
  r.continuous = false;
  r.interimResults = !isSafari;
  r.maxAlternatives = 1;
  return r;
}

function attachWebkitHandlers() {
  recognition.onstart = () => {
    isListening = true;
    micBtn.classList.add('active');
    setStatus('listening', pauseRestartCount === 0 ? 'listening...' : 'still listening...');
  };
  recognition.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    interimEl.textContent = interim || (accumulatedTranscript + ' ' + final).trim();
    if (final) accumulatedTranscript = (accumulatedTranscript + ' ' + final).trim();
  };
  recognition.onerror = (e) => {
    if (e.error === 'no-speech' && pauseRestartCount < PAUSE_RESTARTS) return;
    isListening = false; micBtn.classList.remove('active');
    if (e.error === 'not-allowed') {
      setStatus('idle', 'mic blocked');
      browserNote.textContent = '⚠ Mic denied — check browser settings';
      browserNote.style.color = 'var(--danger)';
    } else if (e.error === 'no-speech') {
      if (accumulatedTranscript) { textInput.value = accumulatedTranscript; handleUserMessage(accumulatedTranscript); }
      else setStatus('idle', 'no speech detected');
    } else { setStatus('idle', 'ready'); }
  };
  recognition.onend = () => {
    isListening = false;
    if (pauseRestartCount < PAUSE_RESTARTS && micBtn.classList.contains('active')) {
      pauseRestartCount++;
      recognition = buildRecognition();
      attachWebkitHandlers();
      try { recognition.start(); } catch(e) {}
      return;
    }
    micBtn.classList.remove('active');
    interimEl.textContent = '';
    const final = accumulatedTranscript;
    accumulatedTranscript = ''; pauseRestartCount = 0;
    if (final) { textInput.value = final; handleUserMessage(final); }
    else if (!isSpeaking) setStatus('idle', 'ready');
  };
}

function startWebkit() {
  recognition = buildRecognition();
  if (!recognition || isListening || isSpeaking) return;
  accumulatedTranscript = ''; pauseRestartCount = 0;
  unlockAudioContext();
  attachWebkitHandlers();
  try { recognition.start(); } catch(e) { console.warn(e); setStatus('idle', 'ready'); }
}

function stopWebkit() {
  if (recognition && isListening) try { recognition.stop(); } catch(e) {}
}

// ══════════════════════════════════════════════════════════════════
// WHISPER WASM
// ══════════════════════════════════════════════════════════════════
function selectModel(btn) {
  // Don't allow switching while loading
  if (whisperLoading) return;
  document.querySelectorAll('.model-choice').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  selectedModel = btn.dataset.model;
  const size = btn.dataset.size;
  document.getElementById('modelName').textContent = selectedModel;
  document.getElementById('modelSizeLabel').textContent = size + ' · q4 quantized · multilingual';

  // Check if already loaded
  if (loadedModels[selectedModel]) {
    whisperPipe = loadedModels[selectedModel];
    modelReady.classList.add('visible');
    document.getElementById('modelReadyLabel').textContent = selectedModel.split('/')[1] + ' loaded ✓';
    downloadBtn.style.display = 'none';
    progressLabel.textContent = '';
    progressWrap.style.display = 'none';
    browserNote.textContent = 'Model loaded — fully local';
    browserNote.style.color = 'var(--success)';
    updateMicState();
  } else {
    whisperPipe = null;
    modelReady.classList.remove('visible');
    downloadBtn.style.display = '';
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Download & load';
    progressLabel.textContent = '';
    progressWrap.style.display = 'none';
    browserNote.textContent = 'Download model to enable local STT';
    browserNote.style.color = '';
    updateMicState();
  }
}

async function loadWhisperModel() {
  if (loadedModels[selectedModel] || whisperLoading) return;
  whisperLoading = true;
  downloadBtn.disabled = true;
  downloadBtn.textContent = 'Loading...';
  progressWrap.style.display = 'block';
  progressBar.style.width = '0%';
  progressLabel.textContent = 'Starting download...';
  setStatus('loading', 'downloading model...');

  try {
    const pipe = await pipeline(
      'automatic-speech-recognition',
      selectedModel,
      {
        dtype: { encoder_model: 'q4', decoder_model_merged: 'q4' },
        progress_callback: (p) => {
          if (p.status === 'downloading' || p.status === 'progress') {
            const pct = p.progress ? Math.round(p.progress) : 0;
            progressBar.style.width = pct + '%';
            const mb = p.loaded ? (p.loaded / 1024 / 1024).toFixed(1) : '?';
            const total = p.total ? (p.total / 1024 / 1024).toFixed(1) : '?';
            progressLabel.textContent = `${p.file || ''} — ${mb} / ${total} MB (${pct}%)`;
          } else if (p.status === 'done') {
            progressLabel.textContent = `✓ ${p.file || 'file'} loaded`;
          } else if (p.status === 'initiate') {
            progressLabel.textContent = `Fetching ${p.file || ''}...`;
          }
        }
      }
    );
    loadedModels[selectedModel] = pipe;
    whisperPipe = pipe;
    whisperLoading = false;
    progressBar.style.width = '100%';
    progressLabel.textContent = 'Model ready!';
    modelReady.classList.add('visible');
    document.getElementById('modelReadyLabel').textContent = selectedModel.split('/')[1] + ' loaded ✓';
    downloadBtn.style.display = 'none';
    // Mark button as loaded
    document.querySelectorAll('.model-choice').forEach(b => {
      if (b.dataset.model === selectedModel) b.classList.add('loaded');
    });
    browserNote.textContent = 'Model loaded — fully local, no data sent anywhere';
    browserNote.style.color = 'var(--success)';
    setStatus('idle', 'ready');
    updateMicState();
  } catch(err) {
    console.error(err);
    progressLabel.textContent = '⚠ Load failed: ' + err.message;
    downloadBtn.disabled = false;
    downloadBtn.textContent = 'Retry';
    whisperLoading = false;
    whisperPipe = null;
    setStatus('idle', 'load failed');
  }
}

// VAD config
const VAD_SILENCE_MS   = 1500;  // stop after 1.5s of silence
const VAD_SPEECH_DB    = -45;   // dB threshold to detect speech start
const VAD_SILENCE_DB   = -55;   // dB threshold for silence
const VAD_MIN_SPEECH_MS = 300;  // ignore clips shorter than this

let silenceTimer  = null;
let analyser      = null;
let vadFrame      = null;
let speechStarted = false;
let activeStream  = null;

function dbFromAnalyser() {
  const buf = new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) {
    const s = (buf[i] - 128) / 128;
    sum += s * s;
  }
  const rms = Math.sqrt(sum / buf.length);
  return rms > 0 ? 20 * Math.log10(rms) : -Infinity;
}

async function startWhisper() {
  if (!whisperPipe || isListening) return;
  activeStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  audioChunks = [];

  // Set up analyser for VAD
  const audioCtxVad = new AudioContext();
  const source = audioCtxVad.createMediaStreamSource(activeStream);
  analyser = audioCtxVad.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);

  mediaRecorder = new MediaRecorder(activeStream);
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    cancelAnimationFrame(vadFrame);
    clearTimeout(silenceTimer);
    activeStream.getTracks().forEach(t => t.stop());
    audioCtxVad.close();

    if (audioChunks.length === 0) {
      setStatus('idle', 'ready');
      micBtn.classList.remove('active');
      isListening = false;
      return;
    }

    setStatus('loading', 'transcribing...');
    micBtn.classList.remove('active');
    isListening = false;

    try {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      const arrayBuffer = await blob.arrayBuffer();
      const audioCtx = new AudioContext({ sampleRate: 16000 });
      const decoded = await audioCtx.decodeAudioData(arrayBuffer);
      const float32 = decoded.getChannelData(0);
      const result = await whisperPipe(float32, {
        language: 'uk',
        task: 'transcribe',
        chunk_length_s: 30,
      });
      const transcript = result.text.trim();
      interimEl.textContent = '';
      if (transcript) { textInput.value = transcript; handleUserMessage(transcript); }
      else setStatus('idle', 'no speech detected');
    } catch(err) {
      console.error(err);
      setStatus('idle', 'transcription failed');
    }
  };

  mediaRecorder.start();
  isListening = true;
  speechStarted = false;
  micBtn.classList.add('active');
  setStatus('listening', 'waiting for speech...');

  // VAD loop
  const recordStart = Date.now();
  function vadTick() {
    if (!isListening) return;
    const db = dbFromAnalyser();

    if (!speechStarted) {
      if (db > VAD_SPEECH_DB) {
        speechStarted = true;
        setStatus('listening', 'recording...');
        interimEl.textContent = '🎙';
      }
    } else {
      if (db < VAD_SILENCE_DB) {
        // Silence detected — start/reset countdown
        if (!silenceTimer) {
          silenceTimer = setTimeout(() => {
            const elapsed = Date.now() - recordStart;
            if (elapsed > VAD_MIN_SPEECH_MS) stopWhisper();
            else {
              // Too short, keep going
              silenceTimer = null;
              speechStarted = false;
              setStatus('listening', 'waiting for speech...');
              interimEl.textContent = '';
            }
          }, VAD_SILENCE_MS);
        }
      } else {
        // Sound again — cancel silence countdown
        if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
        interimEl.textContent = '🎙';
      }
    }
    vadFrame = requestAnimationFrame(vadTick);
  }
  vadFrame = requestAnimationFrame(vadTick);
}

function stopWhisper() {
  clearTimeout(silenceTimer);
  silenceTimer = null;
  cancelAnimationFrame(vadFrame);
  interimEl.textContent = '';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else {
    isListening = false;
    micBtn.classList.remove('active');
    setStatus('idle', 'ready');
  }
}

// ══════════════════════════════════════════════════════════════════
// Unified mic control
// ══════════════════════════════════════════════════════════════════
function startListening() {
  if (sttMode === 'whisper') startWhisper();
  else startWebkit();
}

function stopListening() {
  if (sttMode === 'whisper') stopWhisper();
  else stopWebkit();
}

micBtn.addEventListener('click', () => {
  if (isListening) stopListening();
  else startListening();
});

sendBtn.addEventListener('click', () => handleUserMessage(textInput.value));
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleUserMessage(textInput.value); });

voiceToggle.addEventListener('click', () => {
  ttsEnabled = !ttsEnabled;
  voiceToggle.classList.toggle('on', ttsEnabled);
  if (!ttsEnabled) window.speechSynthesis.cancel();
});

speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();

// ── Init ─────────────────────────────────────────────────────────
setMode('webkit');
setStatus('idle', 'ready');
</script>
